title: "Fr0gB1t"
description: "Security researcher. CTF player. Escribo lo que aprendo."

# ─── LANGUAGE ──────────────────────────────────────────────────────────────────
# Set to "es" or "en". This controls what language the UI renders in.
# Your posts can be written in EITHER language — the UI chrome will adapt.
lang: "en"

author:
  name:       "Fr0gB1t"
  bio_es:     "Security researcher. CTF player. Escribo lo que aprendo."
  bio_en:     "Security researcher. CTF player. I write about what I learn."
  avatar:     "/assets/images/avatar.png"
  github:     "https://github.com/frogb1t"
  #twitter:    "https://twitter.com/tuusuario"
  #hackthebox: "https://app.hackthebox.com/users/tuusuario"
  #linkedin:   "https://linkedin.com/in/tuusuario"

url:     "https://frogb1t.github.io"
baseurl: ""

permalink: /:year/:month/:day/:title/

markdown:   kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.sh"
  - vendor/
