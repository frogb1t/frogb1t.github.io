---
layout: default
---
<a href="{{ '/' | relative_url }}" class="back-link">← inicio</a>

<div class="article-layout">

  <!-- PROSE -->
  <div class="article-body">
    <header class="post-header">
      <div class="post-meta">
        {{ page.date | date: "%d %b %Y" }}{% if page.reading_time %} · {{ page.reading_time }} min lectura{% endif %}
      </div>
      <h1>{{ page.title }}</h1>
      {% if page.tags.size > 0 %}
      <div class="post-tags">
        {% for tag in page.tags %}
          <a href="{{ '/tags/#' | append: tag | relative_url }}" class="post-tag">{{ tag }}</a>
        {% endfor %}
      </div>
      {% endif %}
    </header>

    <div class="prose" id="prose-content">
      {{ content }}
    </div>
  </div>

  <!-- TOC — RIGHT (built dynamically by JS) -->
  <nav class="article-toc" id="article-toc" style="display:none">
    <div class="toc-label">contenido</div>
  </nav>

</div>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';


  mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      securityLevel: 'strict',
  
      themeVariables: {
          darkMode: true,
          background: '#0c0c0c',
          primaryColor: '#111111',
          primaryTextColor: '#d4d4d4',
          primaryBorderColor: '#444444',
          lineColor: '#666666',
          secondaryColor: '#141414',
          tertiaryColor: '#0a0a0a',
          fontFamily: 'Cascadia Code, Fira Code, Consolas, monospace',
          fontSize: '12px'
      },
    
      flowchart: {
          useMaxWidth: true,
          htmlLabels: true,
          curve: 'linear'
      }
  });


  document.addEventListener('DOMContentLoaded', async () => {
    // Transform Rouge/Kramdown blocks into Mermaid containers
    document.querySelectorAll(
      '.language-mermaid pre code, pre code.language-mermaid'
    ).forEach(code => {
      const wrapper = code.closest('div.language-mermaid')
        || code.closest('pre');

      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = code.textContent;

      wrapper.replaceWith(diagram);
    });

    // Render diagrams
    await mermaid.run({
      querySelector: '.mermaid'
    });
  });
</script>
