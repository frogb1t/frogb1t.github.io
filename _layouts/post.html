---
layout: default
---
<article>
  <a href="{{ '/' | relative_url }}" class="back-link">← inicio</a>
  <header class="post-header">
    <div class="post-meta">
      {{ page.date | date: "%d %b %Y" }}{% if page.reading_time %} · {{ page.reading_time }} min lectura{% endif %}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.tags.size > 0 %}
    <div class="post-tags">
      {% for tag in page.tags %}
        <a href="{{ '/tags/#' | append: tag | relative_url }}" class="post-tag">{{ tag }}</a>
      {% endfor %}
    </div>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
