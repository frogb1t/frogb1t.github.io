---
layout: default
---
{{ content }}

<ul class="post-list">
  {% for post in site.posts %}
  <li class="post-list-item">
    <a class="post-list-link" href="{{ post.url | relative_url }}">
      <span class="post-list-title">{{ post.title }}</span>
      <div class="post-list-right">
        <span class="post-list-date">{{ post.date | date: "%d %b %Y" }}</span>
        {% if post.category %}<span class="post-list-cat">{{ post.category }}</span>{% endif %}
      </div>
    </a>
  </li>
  {% endfor %}
</ul>
